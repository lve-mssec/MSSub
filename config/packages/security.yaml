security:
    # Argon2id via sodium : le hachage le plus solide disponible dans l'image,
    # et « auto » suivra les recommandations de Symfony sans intervention.
    password_hashers:
        App\Entity\User: 'auto'

    providers:
        app_users:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_users
            # Un compte desactive ne doit pas pouvoir entrer, quelle que soit sa
            # source d'authentification : le controle est donc au niveau du pare-feu.
            user_checker: App\Security\UserChecker
            # Un authentificateur maison plutôt que form_login : le même
            # formulaire doit servir les comptes locaux et les comptes
            # d'annuaire, ce que form_login et form_login_ldap ne savent pas
            # faire ensemble — tous deux répondent à la même requête.
            custom_authenticator: App\Security\LoginAuthenticator
            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/connexion, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

    role_hierarchy:
        ROLE_OPERATOR: ROLE_USER
        ROLE_ADMIN: ROLE_OPERATOR

when@test:
    security:
        password_hashers:
            # Le hachage fort coute cher : inutile de le payer a chaque test.
            App\Entity\User:
                algorithm: plaintext
