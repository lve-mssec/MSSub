; MSSub — réglages PHP. Le développement écrase opcache.validate_timestamps via compose.
date.timezone = Europe/Paris
memory_limit = 512M
expose_php = Off

; Imports CSV/XLSX d'un existant : les fichiers de plan d'adressage peuvent être gros.
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 120

opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Sessions : durcissement de base, complété côté Symfony.
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
