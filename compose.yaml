name: mssub

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      # Le code vit sur le Mac, le runtime dans le conteneur.
      - .:/var/www/html
    ports:
      - "8080:80"
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      DATABASE_URL: "mysql://${DB_USER:-mssub}:${DB_PASSWORD:-mssub}@db:3306/${DB_NAME:-mssub}?serverVersion=11.4.0-MariaDB&charset=utf8mb4"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-mssub}
      MARIADB_USER: ${DB_USER:-mssub}
      MARIADB_PASSWORD: ${DB_PASSWORD:-mssub}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Décalé pour ne pas heurter un MariaDB local.
      - "13306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  adminer:
    image: adminer:5
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

  # Annuaire de développement, démarré à la demande :
  #   docker compose --profile annuaire up -d
  # Il n'a aucune raison de tourner en permanence, mais sans lui le code LDAP
  # ne serait jamais exécuté avant d'arriver chez un client.
  annuaire:
    image: osixia/openldap:1.5.0
    profiles: ["annuaire"]
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: MSSEC
      LDAP_DOMAIN: mssec.local
      LDAP_ADMIN_PASSWORD: adminpass
    volumes:
      - ./docker/openldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-mssub.ldif:ro
    ports:
      - "1389:389"

volumes:
  db_data:

